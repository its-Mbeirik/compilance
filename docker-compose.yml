services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conformite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conformite_secret}
      POSTGRES_DB: ${POSTGRES_DB:-conformite_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conformite} -d ${POSTGRES_DB:-conformite_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://conformite:conformite_secret@postgres:5432/conformite_db
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@conformia.mr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      SECRET_KEY: ${SECRET_KEY:-conformia-secret-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-conformaimr@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-jbob vdih ahin fzev}
      SMTP_FROM: ${SMTP_FROM:-conformaimr@gmail.com}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - ./resourse:/app/resourse:ro
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
  model_cache:
